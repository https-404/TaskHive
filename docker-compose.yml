
services:
  mysql:
    image: mysql:8.0
    container_name: taskhive_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskhive
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: taskhive
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taskhive_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
    driver: local

networks:
  taskhive_network:
    driver: bridge

